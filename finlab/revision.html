<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FINLAB | Revisión docente</title><style>body{margin:0;background:#f4f6f9;color:#192d43;font:16px/1.55 system-ui}header{background:#102c4b;color:white;padding:20px}main{max-width:950px;margin:auto;padding:24px}section{background:white;border:1px solid #dbe3ec;border-radius:12px;padding:20px;margin:16px 0}h1,h2,h3{color:#102c4b}header h1{color:white;margin:0}button{padding:10px 16px;border-radius:8px;background:#102c4b;color:white;border:0;cursor:pointer}p{white-space:pre-wrap}img{max-width:100%;max-height:350px}small{color:#53667b}.empty{color:#53667b}figure{margin:15px 0}label{font-weight:bold}</style></head><body><header><h1>FINLAB · Revisión docente</h1><span>Consulta del manual compartido</span></header><main><p>Esta vista solo muestra la información que ya se guardó en Google Sheets. No modifica el manual ni recupera cambios que aún estén solo en el equipo de la estudiante.</p><button id="refresh">Actualizar consulta</button> <small id="status" role="status">Cargando…</small><div id="content"></div></main><script>
const URL_DATOS='https://script.google.com/macros/s/AKfycbwfgtZKskIATw8XALI1G7lWUBayznuQJQ2Hb-dKAzCMHQYs6nwQyWm3X_U_f6xb2jyQsA/exec';
const nombres=['Investiga qué es MetaTrader 5','Ingresa al terminal web','Aprende a documentar un procedimiento','Reconoce la interfaz','Realiza la configuración inicial','Explora los instrumentos financieros','Aprende a utilizar los gráficos','Interpreta velas e indicadores','Aprende las operaciones simuladas','Comprende la gestión del riesgo','Consulta los resultados','Realiza un ejercicio integral','Documenta problemas frecuentes','Construye el glosario','Organiza referencias bibliográficas','Realiza el control de calidad','Prepara la entrega final'];
const out=document.getElementById('content'), status=document.getElementById('status');
function elem(tag,text,parent){const e=document.createElement(tag);if(text!=null)e.textContent=text;parent.appendChild(e);return e}
function mostrar(r){out.replaceChildren();if(!r.ok){status.textContent='No se pudo consultar el manual';return}status.textContent='Última actualización: '+(r.actualizado||'sin datos');const m=r.manual;if(!m){elem('p','El manual compartido está vacío.',out);return}let p=elem('section',null,out);elem('h2','Datos del manual',p);elem('p','Estudiante: '+(m.profile?.name||'Sin registrar')+'\nDocente: '+(m.profile?.teacher||'Sin registrar'),p);(m.items||[]).forEach((a,i)=>{let s=elem('section',null,out);elem('h2',(i+1)+'. '+(nombres[i]||'Actividad'),s);elem('small',a.done?'Validada':'Pendiente de validar',s);let answers=(a.answers||[]);elem('h3','Respuestas',s);answers.forEach((v,j)=>elem('p',(j+1)+'. '+(v||'Sin respuesta'),s));elem('h3','Texto del manual',s);elem('p',a.draft||'Sin redactar',s);if(a.note)elem('p','Observaciones: '+a.note,s);if(a.status)elem('p','Estado: '+a.status,s);let images=a.images||[];if(images.length){elem('h3','Capturas',s);images.forEach(im=>{if(!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(im.url))return;let f=elem('figure',null,s),img=elem('img',null,f);img.src=im.url;img.alt=im.title||'Captura de la actividad';elem('figcaption',im.title||'Sin título',f)})}})}
function cargar(){status.textContent='Consultando…';let cb='finlabCallback_'+Date.now()+'_'+Math.floor(Math.random()*1e7),sc=document.createElement('script'),timer=setTimeout(()=>{delete window[cb];sc.remove();status.textContent='No se pudo consultar. Inténtelo de nuevo.'},25000);window[cb]=data=>{clearTimeout(timer);delete window[cb];sc.remove();mostrar(data)};sc.onerror=()=>{clearTimeout(timer);delete window[cb];sc.remove();status.textContent='No se pudo consultar. Inténtelo de nuevo.'};sc.src=URL_DATOS+'?callback='+cb+'&t='+Date.now();document.head.appendChild(sc)}document.getElementById('refresh').onclick=cargar;cargar();
</script></body></html>

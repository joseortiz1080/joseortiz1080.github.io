const data=[
[1,1,'Investiga qué es MetaTrader 5',20,'Comprender la plataforma y el alcance del manual.',['Crea tu perfil y lee el alcance del proyecto.','Consulta la página oficial de MetaTrader 5.','Distingue versión web, escritorio y cuenta demo.','Registra el enlace y redacta con tus palabras.'],['¿Qué es MT5 y para qué sirve?','¿Qué instrumentos se pueden consultar o negociar y de qué depende su disponibilidad?','¿En qué se diferencian MT5 Web, escritorio, cuenta demo y real?'],'Redacta la introducción: objetivo, público, alcance, utilidad y limitaciones. Incluye fuentes consultadas.',false],
[1,2,'Ingresa al terminal web',40,'Acceder y distinguir el modo de prueba de una cuenta demo operativa.',['Abre el enlace oficial desde tu navegador.','Identifica si puedes entrar sin cuenta o conectar una cuenta demo.','Comprueba si aparecen opciones de servidor y autenticación; no compartas credenciales.','Registra el tipo de entorno y si admite operaciones simuladas. No abras cuenta real.'],['¿Qué navegador y dirección utilizaste?','¿Qué opciones aparecen y cuál seleccionaste?','¿Tu entorno es modo de prueba o cuenta demo operativa? ¿Cómo lo comprobaste?'],'Escribe requisitos, URL, pasos reales de acceso, resultado esperado y restricciones. Si se necesita otro servidor, consulta al docente.',true],
[1,2,'Aprende a documentar un procedimiento',45,'Convertir las observaciones en instrucciones reproducibles.',['Repite el procedimiento de acceso siguiendo tus propias instrucciones.','Identifica controles por su nombre real.','Numera los pasos y registra resultados.','Revisa que cada captura tenga título y que no muestre datos privados.'],['¿Qué requisitos previos necesita el lector?','¿Qué pasos fueron ambiguos al repetir el procedimiento? ¿Cómo los corregiste?'],'Añade un procedimiento completo: objetivo, requisitos, pasos numerados, resultado, observaciones, estado de verificación y fuente.',false],
[1,3,'Reconoce la interfaz',65,'Identificar los componentes visibles y sus funciones.',['Explora observación del mercado y símbolos.','Ubica gráfico, herramientas, información de cuenta y panel de operaciones si aparecen.','Localiza historial y configuración, si existen.','Registra nombre, ubicación y uso de cada componente visible.'],['¿Dónde se consultan instrumentos y cotizaciones?','¿Qué paneles y herramientas observaste?','¿Qué componentes no encontraste o no están disponibles?'],'Describe cada componente: nombre, ubicación, función, acceso y limitación. Adjunta capturas identificadas.',true],
[1,4,'Realiza la configuración inicial',55,'Modificar y documentar el espacio de trabajo.',['Selecciona un instrumento disponible.','Cambia temporalidad y tipo de gráfico.','Prueba zoom y consulta de cotizaciones.','Registra las preferencias disponibles y revisa los capítulos 1–4.'],['¿Qué instrumento seleccionaste y cómo?','¿Qué cambios de visualización pudiste hacer?','¿Qué configuración no pudiste comprobar y por qué?'],'Redacta procedimientos de configuración con pasos, resultado y capturas. Indica qué quedó pendiente.',true],
[2,5,'Explora los instrumentos financieros',30,'Interpretar símbolos, clases de instrumentos y precios.',['Consulta tres símbolos disponibles.','Identifica qué activo o contrato representa cada uno; no supongas que es propiedad directa.','Localiza Bid y Ask y registra valores observados.','Explica el spread y verifica el origen de los datos.'],['¿Qué tres símbolos encontraste y qué representan?','¿Cuáles son Bid y Ask en un ejemplo observado?','¿Qué es el spread y cómo se calcula en ese ejemplo?'],'Describe cómo buscar, seleccionar y consultar los instrumentos; incluye una comparación de los tres.',true],
[2,6,'Aprende a utilizar los gráficos',45,'Configurar gráficos y temporalidades.',['Selecciona un símbolo.','Prueba línea, barras y velas si están disponibles.','Compara dos temporalidades (por ejemplo M15 y H1).','Usa zoom y navegación y registra los resultados.'],['¿Qué diferencia hay entre línea, barras y velas?','¿Qué representa M15, H1 y D1?','¿Qué cambios verificaste y dónde se hacen?'],'Redacta el procedimiento de cambio de gráfico y temporalidad con ejemplos y capturas.',true],
[2,6,'Interpreta velas e indicadores',45,'Comprender OHLC y una media móvil.',['Identifica una vela alcista y otra bajista.','Localiza apertura, máximo, mínimo y cierre en la interfaz.','Agrega una media móvil si está disponible.','Registra su configuración y explica sus límites.'],['¿Cómo distingues vela alcista y bajista?','¿Qué significan los cuatro valores OHLC?','¿Qué representa la media móvil? ¿Pudiste aplicarla?'],'Explica la lectura de velas y el procedimiento de incorporación del indicador. No atribuyas capacidad predictiva garantizada.',true],
[2,7,'Aprende las operaciones simuladas',60,'Comprender órdenes, volumen y ejecución en una cuenta demo autorizada.',['Confirma que la cuenta es demo antes de actuar.','Explora la ventana de orden: símbolo, volumen, Buy y Sell, si está disponible.','Solo si el entorno permite operar, ejecuta y cierra compra y venta simuladas.','Explora órdenes pendientes y registra limitaciones; no uses fondos reales.'],['¿Qué diferencias hay entre orden de mercado y pendiente?','¿Qué significan lote, margen, apalancamiento y spread?','¿Qué operación simulada ejecutaste y cerraste, o qué restricción comprobaste?'],'Escribe pasos de apertura y cierre, parámetros, resultados y estados verificados. Si no hay negociación, separa teoría de práctica pendiente.',true],
[2,8,'Comprende la gestión del riesgo',45,'Interpretar Stop Loss y Take Profit sin operar con dinero real.',['Investiga Stop Loss y Take Profit.','Para un ejemplo conceptual con entrada 100, calcula SL y TP para compra y venta.','Si el entorno demo lo permite, configura o modifica estos parámetros.','Registra qué controles comprobaste y revisa capítulos 5–8.'],['¿En qué se diferencian Stop Loss y Take Profit?','Con entrada 100, riesgo 2 y objetivo 4, ¿qué niveles corresponden a compra y venta?','¿Cómo se configuran o qué restricción observaste?'],'Documenta el procedimiento o la restricción; explica deslizamiento y que SL no garantiza precio exacto de ejecución.',true],
[3,9,'Consulta los resultados',35,'Interpretar información de cuenta e historial.',['Busca balance, patrimonio, margen y margen libre.','Identifica posiciones, órdenes e historial, si están disponibles.','Registra resultados simulados y explica sus diferencias.','Señala funciones no comprobadas.'],['¿Qué diferencia hay entre balance y patrimonio?','¿Qué significan margen utilizado, margen libre y nivel de margen?','¿Qué información pudiste consultar en posiciones o historial?'],'Redacta instrucciones de seguimiento e interpretación de resultados; incorpora evidencia y restricciones.',true],
[3,9,'Realiza un ejercicio integral',50,'Reproducir los procedimientos aprendidos en un caso completo.',['Accede y verifica el entorno demo.','Selecciona símbolo, velas, temporalidad e indicador.','Solo si es demo operativa, abre, configura SL/TP y cierra una posición; consulta historial.','Registra los pasos ejecutados, resultados y puntos pendientes.'],['¿Qué símbolo, temporalidad e indicador utilizaste?','¿Qué pasos ejecutaste y cuál fue el resultado?','¿Qué problemas encontraste y qué acciones no pudieron comprobarse?'],'Escribe un caso integral reproducible desde el acceso hasta el resultado; diferencia claramente teoría y práctica.',true],
[3,10,'Documenta problemas frecuentes',25,'Construir una guía de solución de problemas.',['Revisa dificultades de acceso, conexión y símbolos.','Investiga problemas de datos, indicadores y órdenes.','Contrasta posibles causas con fuentes o experiencia.','Diferencia causas verificadas de hipótesis.'],['¿Qué tres dificultades detectaste o investigaste?','¿Cuáles son sus posibles causas y soluciones?','¿Qué soluciones comprobaste personalmente y cuáles no?'],'Crea una lista de problemas con causa, solución paso a paso, fuente y estado de verificación.',false],
[3,11,'Construye el glosario',30,'Definir al menos 25 términos técnicos.',['Selecciona 25 términos usados en el manual.','Consulta fuentes confiables.','Escribe cada término, definición y aplicación.','Comprueba consistencia con el resto del texto.'],['¿Qué fuentes utilizaste para el glosario?','¿Qué términos consideras más importantes para un principiante y por qué?'],'Escribe al menos 25 entradas, una por línea, con el formato Término — definición — aplicación en MT5.',false],
[3,12,'Organiza referencias bibliográficas',25,'Registrar referencias reales en APA 7.',['Recupera las fuentes consultadas durante las sesiones.','Verifica autor corporativo, título, fecha si existe y URL.','Aplica APA 7 sin inventar fechas.','Comprueba que los enlaces correspondan a la versión web.'],['¿Qué fuentes oficiales consultaste?','¿Cómo verificaste que corresponden a la versión web?'],'Incluye las referencias bibliográficas completas (una por línea) y los anexos que correspondan.',false],
[3,12,'Realiza el control de calidad',35,'Revisar la reproducibilidad y exactitud técnica.',['Repite un procedimiento siguiendo exclusivamente tu texto.','Revisa capítulos, capturas, figuras, fuentes y restricciones.','Corrige pasos ambiguos y errores conceptuales.','Comprueba que no hayas incluido credenciales, datos sensibles o afirmaciones no verificadas.'],['¿Qué procedimiento repetiste y cuál fue el resultado?','¿Qué errores encontraste y corregiste?','¿Qué limitaciones o pendientes siguen existiendo?'],'Redacta el registro de pruebas, correcciones y limitaciones del manual.',false],
[3,12,'Prepara la entrega final',25,'Consolidar el manual Word/PDF y dejar constancia de la revisión.',['Abre la vista previa del manual y revisa portada, índice y los 12 capítulos.','Confirma que las figuras tienen títulos y que las fuentes están registradas.','Revisa los datos de autora y docente.','Finaliza la actividad y descarga Word; utiliza Imprimir/Guardar como PDF para la segunda versión.'],['¿Qué revisión final realizaste?','¿Qué limitaciones debe conocer el lector?'],'Escribe una breve declaración de alcance y cierre del trabajo, con pendientes si existen.',false]
];
const fresh=()=>({version:1,profile:{name:'',teacher:'',campus:'Villavicencio',year:'2026'},items:data.map(a=>({answers:a[6].map(()=>''),draft:'',checks:a[5].map(()=>false),images:[],status:'',note:'',done:false}))});let state=fresh(),page='home',db,saveTimer,dirty=false;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const txt=s=>String(s||'').trim();
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('finlab-mt5-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('progress');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function getDB(){return new Promise((resolve,reject)=>{let r=db.transaction('progress').objectStore('progress').get('student');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function save(){clearTimeout(saveTimer);dirty=true;$('saveState').textContent='Guardando…';saveTimer=setTimeout(saveNow,250)}async function saveNow(){clearTimeout(saveTimer);try{if(!db)throw Error('Sin almacenamiento local');await new Promise((resolve,reject)=>{let t=db.transaction('progress','readwrite');t.objectStore('progress').put(state,'student');t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)});dirty=false;$('saveState').textContent='Guardado local'}catch(e){$('saveState').textContent='No guardado · exporta respaldo';console.error(e)}}window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
function valid(i){let a=data[i],r=state.items[i],e=[];if(r.answers.some(x=>txt(x).length<15))e.push('Responde cada pregunta (mín. 15 caracteres).');if(txt(r.draft).length<60)e.push('Redacta el apartado del manual (mín. 60 caracteres).');if(i===13&&r.draft.split('\n').filter(x=>txt(x).length>5).length<25)e.push('Incluye 25 entradas del glosario, una por línea.');if(!r.checks.every(Boolean))e.push('Confirma todos los pasos, o registra lo que no fue posible.');if(!r.status)e.push('Selecciona el estado de verificación.');if(r.status&&r.status!=='Verificado'&&txt(r.note).length<15)e.push('Explica la restricción o la verificación pendiente.');if(a[8]&&!r.images.length&&!(r.status&&r.status!=='Verificado'&&txt(r.note).length>=15))e.push('Adjunta al menos una captura propia o documenta la restricción.');if(r.images.some(x=>!txt(x.title)))e.push('Asigna un título a cada captura.');return e}const done=i=>state.items[i].done&&!valid(i).length;const count=()=>data.filter((_,i)=>done(i)).length;const unlocked=i=>data.slice(0,i).every((_,j)=>done(j));const profileOK=()=>txt(state.profile.name)&&txt(state.profile.teacher);function invalidate(i){state.items[i].done=false;save();updateNav();updateStatus(i)}function go(p){page=p;render();window.scrollTo(0,0);$('nav').classList.remove('open')}
function updateNav(){let n=`<button data-go="home" class="${page==='home'?'active':''}">⌂ Inicio y perfil</button><button data-go="manual" class="${page==='manual'?'active':''}">▤ Mi manual / exportar</button><button data-go="backup" class="${page==='backup'?'active':''}">⇩ Respaldo y entrega</button>`;for(let s=1;s<=3;s++){n+=`<h4>SESIÓN ${s} · 4 HORAS</h4>`;data.forEach((a,i)=>{if(a[0]===s)n+=`<button data-go="${i}" ${unlocked(i)&&profileOK()?'':'disabled'} class="${page===i?'active':''}">${done(i)?'✓':unlocked(i)?'○':'·'} ${i+1}. ${esc(a[2])}</button>`})}$('nav').innerHTML=n;$('nav').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(/^\d+$/.test(b.dataset.go)?+b.dataset.go:b.dataset.go))}
function render(){updateNav();if(page==='home')home();else if(page==='manual')manualPage();else if(page==='backup')backupPage();else activity(page)}
function home(){let n=count();$('main').innerHTML=`<div class="eyebrow">Administración Financiera · UNIMINUTO</div><h1>Guía para construir tu manual de MT5 Web</h1><p>Aprende desde cero, responde con tus palabras, comprueba cada paso y genera tu propio documento académico.</p><div class="stats"><div class="stat"><span class="muted">Duración total</span><strong>12 h</strong>3 sesiones</div><div class="stat"><span class="muted">Actividades validadas</span><strong>${n}/17</strong>Validación de requisitos</div><div class="stat"><span class="muted">Avance</span><strong>${Math.round(n/17*100)}%</strong><div class="bar"><i style="width:${n/17*100}%"></i></div></div></div><div class="panel"><h2>Antes de comenzar</h2><p>Necesitas un computador, navegador actualizado, conexión a internet y cuenta gratuita de ChatGPT opcional. Guarda tus capturas originales aparte.</p><div class="notice">No utilices dinero real. El modo de prueba público puede no permitir operaciones. Consulta al docente si necesitas una cuenta demo operativa. Nunca adjuntes credenciales ni datos privados.</div><label class="field">Nombre de la autora *<input type="text" id="name" value="${esc(state.profile.name)}" placeholder="Nombre completo"></label><label class="field">Docente supervisor *<input type="text" id="teacher" value="${esc(state.profile.teacher)}" placeholder="Nombre del docente"></label><div class="line"><label class="field" style="flex:1">Centro universitario<input type="text" id="campus" value="${esc(state.profile.campus)}"></label><label class="field" style="flex:1">Año<input type="text" id="year" value="${esc(state.profile.year)}"></label></div><button class="primary" id="start" ${profileOK()?'':'disabled'}> ${n?'Continuar proyecto':'Comenzar sesión 1'} →</button><p class="muted">Tu trabajo se guarda en este navegador y dispositivo. Descarga un respaldo al terminar cada sesión para conservar una copia y retomarla si cambias de equipo.</p></div><div class="panel"><h2>Ruta de aprendizaje</h2>${sessions.map((s,j)=>{let indices=data.map((a,i)=>a[0]===j+1?i:-1).filter(i=>i>=0),c=indices.filter(done).length;return `<div class="panel"><div class="line between"><strong>Sesión ${j+1} · ${esc(s)}</strong><span class="pill">${c}/${indices.length} actividades</span></div><p class="muted">4 horas · incluye descanso de 15 minutos</p><div class="bar"><i style="width:${c/indices.length*100}%"></i></div></div>`}).join('')}<p><a href="${OFFICIAL}" target="_blank" rel="noopener">Documentación oficial de MT5 Web</a></p></div>`;['name','teacher','campus','year'].forEach(k=>$(k).oninput=e=>{state.profile[k]=e.target.value;save();updateNav();$('start').disabled=!profileOK()});$('start').onclick=()=>go(data.findIndex((_,i)=>!done(i))<0?'manual':data.findIndex((_,i)=>!done(i)))}
function activity(i){if(!unlocked(i)||!profileOK()){go('home');return}let a=data[i],r=state.items[i];$('main').innerHTML=`<div class="eyebrow">Sesión ${a[0]} · Actividad ${i+1} de 17 · ${a[3]} min · Capítulo ${a[1]}</div><h1>${esc(a[2])}</h1><p>${esc(a[4])}</p><div class="line"><a href="${LINK}" target="_blank" rel="noopener">Abrir MT5 Web ↗</a><a href="${OFFICIAL}" target="_blank" rel="noopener">Documentación oficial ↗</a></div><div class="panel"><h2>1. Ejecuta los pasos</h2><p class="muted">Marca cada paso después de ejecutarlo o comprobar y documentar por qué no se puede realizar.</p>${a[5].map((s,j)=>`<label class="check"><input type="checkbox" data-check="${j}" ${r.checks[j]?'checked':''}><span>${esc(s)}</span></label>`).join('')}</div><div class="panel"><h2>2. Responde con tus propias palabras</h2>${a[6].map((q,j)=>`<label class="field">${j+1}. ${esc(q)} *<textarea data-answer="${j}" placeholder="Escribe tu respuesta…">${esc(r.answers[j])}</textarea></label>`).join('')}</div><div class="panel"><h2>3. Registra evidencias</h2><p class="muted">${a[8]?'Se requiere al menos una captura propia, salvo restricción documentada.':'Capturas opcionales en esta actividad.'} Elimina u oculta datos privados antes de cargar. Máximo 6 imágenes por actividad, 10 MB por archivo; se optimizan localmente.</p><label class="field">Añadir capturas<input type="file" id="images" accept="image/png,image/jpeg,image/webp" multiple></label><div class="evidence" id="gallery"></div><label class="field">Estado de verificación *<select id="status"><option value="">Selecciona…</option>${['Verificado','Parcial / pendiente','No disponible en mi entorno'].map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select></label><label class="field">Observaciones / restricciones (obligatorio si no está verificado)<textarea id="note" placeholder="Qué comprobaste, qué faltó y por qué…">${esc(r.note)}</textarea></label></div><div class="panel"><h2>4. Redacta el apartado del manual *</h2><p>${esc(a[7])}</p><textarea class="big" id="draft" placeholder="Escribe el texto que se incorporará al capítulo ${a[1]}…">${esc(r.draft)}</textarea><p class="muted" id="words"></p></div><div class="panel"><h2>5. Validación de requisitos</h2><div id="validation" role="status"></div><div class="footer-actions"><button id="prev">Anterior</button><button id="finish" class="primary">Validar actividad y continuar →</button><button id="preview">Ver mi manual</button></div><p class="muted">La validación automática comprueba campos y evidencias, no garantiza exactitud académica. La revisión corresponde al docente.</p></div>`;$('main').querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{r.checks[+e.dataset.check]=e.checked;invalidate(i)});$('main').querySelectorAll('[data-answer]').forEach(e=>e.oninput=()=>{r.answers[+e.dataset.answer]=e.value;invalidate(i)});for(let k of ['note','draft','status'])$(k)[k==='status'?'onchange':'oninput']=e=>{r[k]=e.target.value;invalidate(i)};$('images').onchange=async e=>{let files=[...e.target.files];e.target.value='';for(let f of files){if(r.images.length>=6){alert('Máximo 6 capturas por actividad.');break}if(f.size>10*1024*1024){alert('Imagen superior a 10 MB: '+f.name);continue}try{r.images.push(await optimize(f));invalidate(i);if(page===i)gallery(i)}catch(err){alert('No se pudo leer '+f.name)}}};$('prev').onclick=()=>go(i===0?'home':i-1);$('preview').onclick=()=>go('manual');$('finish').onclick=async()=>{if(valid(i).length)return;r.done=true;await saveNow();if([4,9,16].includes(i)){go('backup')}else go(i+1)};gallery(i);updateStatus(i)}
function updateStatus(i){if(page!==i||!$('validation'))return;let errs=valid(i);$('validation').innerHTML=errs.length?`<ul class="err">${errs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<p class="ok">${done(i)?'Actividad marcada como completada.':'Campos mínimos completos. Puedes validar y continuar.'}</p>`;$('finish').disabled=!!errs.length;$('words').textContent=`${txt(state.items[i].draft)?txt(state.items[i].draft).split(/\s+/).length:0} palabras redactadas`}
function gallery(i){let r=state.items[i];$('gallery').innerHTML=r.images.map((im,j)=>`<div class="photo"><img src="${im.url}" alt="${esc(im.title||'Captura')}"/><label class="muted">Título de figura *<input type="text" data-title="${j}" value="${esc(im.title)}" placeholder="Describe la captura"></label><button data-remove="${j}">Eliminar</button></div>`).join('');$('gallery').querySelectorAll('[data-title]').forEach(e=>e.oninput=()=>{r.images[+e.dataset.title].title=e.value;invalidate(i)});$('gallery').querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{if(confirm('¿Eliminar esta captura?')){r.images.splice(+e.dataset.remove,1);invalidate(i);gallery(i)}})}
function optimize(f){return new Promise((resolve,reject)=>{let url=URL.createObjectURL(f),im=new Image();im.onload=()=>{let scale=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));let ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve({url:c.toDataURL('image/jpeg',.85),width:c.width,height:c.height,title:''})};im.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Imagen inválida'))};im.src=url})}
async function copy(s,msg){try{await navigator.clipboard.writeText(s);alert(msg)}catch(e){window.prompt('Copia este texto:',s)}}
function download(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}

function backupPage(){let n=count();$('main').innerHTML=`<div class="eyebrow">Persistencia y entrega</div><h1>Respaldo de tu trabajo</h1><div class="panel"><h2>${n} de 17 actividades completadas</h2><p>Descarga el archivo de respaldo al final de cada sesión. Incluye respuestas, textos y capturas optimizadas. Envíalo al docente por un canal institucional privado si te lo solicita. No lo publiques.</p><div class="line"><button class="primary" id="downloadBackup">Descargar respaldo JSON</button><button id="restore">Restaurar respaldo</button></div><p class="muted">Restaurar reemplaza el trabajo local. No existe sincronización entre dispositivos ni panel docente remoto en esta versión.</p></div><div class="panel"><h2>Continuar</h2><button class="primary" id="next">${n===17?'Ir a exportación final':'Continuar siguiente actividad'} →</button> <button id="view">Vista previa del manual</button></div>`;$('downloadBackup').onclick=backup;$('restore').onclick=()=>$('restoreFile').click();$('next').onclick=()=>{let i=data.findIndex((_,j)=>!done(j));go(i<0?'manual':profileOK()?i:'home')};$('view').onclick=()=>go('manual')}
function safeState(s){if(!s||s.version!==1||!s.profile||!Array.isArray(s.items)||s.items.length!==data.length)throw Error('Formato inválido');let out=fresh();for(let k of Object.keys(out.profile))out.profile[k]=String(s.profile[k]||'').slice(0,300);s.items.forEach((r,i)=>{if(!Array.isArray(r.answers)||r.answers.length!==data[i][6].length||!Array.isArray(r.checks)||r.checks.length!==data[i][5].length||!Array.isArray(r.images)||r.images.length>6)throw Error('Actividad inválida');out.items[i]={answers:r.answers.map(x=>String(x)),draft:String(r.draft||''),checks:r.checks.map(x=>x===true),status:['Verificado','Parcial / pendiente','No disponible en mi entorno'].includes(r.status)?r.status:'',note:String(r.note||''),done:r.done===true,images:r.images.map(im=>{if(!/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(im.url)||!(im.width>0&&im.width<=1600&&im.height>0&&im.height<=1600))throw Error('Imagen inválida');return {url:im.url,title:String(im.title||''),width:+im.width,height:+im.height}})}});return out}
$('restoreFile').onchange=async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{let s=safeState(JSON.parse(await f.text()));if(confirm('¿Reemplazar el trabajo local por este respaldo?')){state=s;await saveNow();go('home')}}catch(err){alert('No se pudo restaurar: '+err.message)}};

function manualHTML(){return `<article class="manual">${documentModel().map(b=>b.kind==='cover'?`<section class="cover"><p>${esc(b.lines[0])}<br>${esc(b.lines[1])}</p><h1>${esc(b.lines[2])}</h1><h2>${esc(b.lines[3])}</h2><p>${esc(b.lines[4])}</p><p>${esc(b.lines.slice(5).join('\n'))}</p></section>`:b.kind==='toc'?`<section class="toc"><h2>Tabla de contenido</h2>${b.lines.map(l=>`<div>${esc(l)}</div>`).join('')}</section>`:`<section class="chapter"><h2>${esc(b.title)}</h2>${b.entries.map(e=>`<div class="entry"><h3>${esc(e.title)}</h3><p>${esc(e.draft||'[Redacción pendiente]')}</p><p><strong>Estado de verificación:</strong> ${esc(e.status)}</p>${e.note?`<p><strong>Observaciones:</strong> ${esc(e.note)}</p>`:''}${e.images.map(im=>`<figure><img src="${im.url}" alt="${esc(im.title)}"><figcaption>${esc(im.caption)}<br>Fuente: elaboración propia mediante captura de pantalla.</figcaption></figure>`).join('')}</div>`).join('')}</section>`).join('')}</article>`}

const encoder=new TextEncoder();const bytes=x=>typeof x==='string'?encoder.encode(x):x;const crcTable=Uint32Array.from({length:256},(_,i)=>{for(let j=0;j<8;j++)i=i&1?0xedb88320^(i>>>1):i>>>1;return i>>>0});function crc32(b){let c=0xffffffff;for(let x of b)c=crcTable[(c^x)&255]^(c>>>8);return (c^0xffffffff)>>>0}function zip(files){let locals=[],central=[],offset=0,centralSize=0;for(let [path,content] of Object.entries(files)){let name=bytes(path),body=bytes(content),crc=crc32(body),l=new Uint8Array(30+name.length),d=new DataView(l.buffer);d.setUint32(0,0x04034b50,true);d.setUint16(4,20,true);d.setUint16(6,0x800,true);d.setUint16(12,33,true);d.setUint32(14,crc,true);d.setUint32(18,body.length,true);d.setUint32(22,body.length,true);d.setUint16(26,name.length,true);l.set(name,30);locals.push(l,body);let c=new Uint8Array(46+name.length),v=new DataView(c.buffer);v.setUint32(0,0x02014b50,true);v.setUint16(4,20,true);v.setUint16(6,20,true);v.setUint16(8,0x800,true);v.setUint16(14,33,true);v.setUint32(16,crc,true);v.setUint32(20,body.length,true);v.setUint32(24,body.length,true);v.setUint16(28,name.length,true);v.setUint32(42,offset,true);c.set(name,46);central.push(c);centralSize+=c.length;offset+=l.length+body.length}let end=new Uint8Array(22),v=new DataView(end.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,central.length,true);v.setUint16(10,central.length,true);v.setUint32(12,centralSize,true);v.setUint32(16,offset,true);return new Blob([...locals,...central,end],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'})}

function para(text,style='',extra=''){return String(text??'').split(/\r?\n/).map(line=>`<w:p><w:pPr>${style?`<w:pStyle w:val="${style}"/>`:''}${extra}</w:pPr><w:r><w:t xml:space="preserve">${xml(line)}</w:t></w:r></w:p>`).join('')};const pageBreak='<w:p><w:r><w:br w:type="page"/></w:r></w:p>';

files['[Content_Types].xml']=xmlHead+`<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="jpg" ContentType="image/jpeg"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`;files['_rels/.rels']=xmlHead+`<Relationships xmlns="${pkgns}"><Relationship Id="rId1" Type="${relns}/officeDocument" Target="word/document.xml"/></Relationships>`;files['word/_rels/document.xml.rels']=xmlHead+`<Relationships xmlns="${pkgns}"><Relationship Id="rIdStyles" Type="${relns}/styles" Target="styles.xml"/>${rels.join('')}</Relationships>`;files['word/document.xml']=xmlHead+`<w:document xmlns:w="${wns}" xmlns:r="${relns}" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><w:body>${body}<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>`;files['word/styles.xml']=xmlHead+`<w:styles xmlns:w="${wns}"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial"/><w:sz w:val="22"/><w:lang w:val="es-CO"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="140" w:line="360" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>${[['Title','Título',42,true,'center',0],['Subtitle','Subtítulo',30,true,'center',0],['Cover','Portada',24,false,'center',0],['Heading1','heading 1',32,true,'left',1],['Heading2','heading 2',26,true,'left',2],['Caption','Leyenda',19,false,'center',0]].map(([id,name,size,bold,align,level])=>`<w:style w:type="paragraph" w:styleId="${id}"><w:name w:val="${name}"/><w:basedOn w:val="Normal"/><w:pPr><w:jc w:val="${align}"/>${level?`<w:keepNext/><w:outlineLvl w:val="${level-1}"/>`:''}<w:spacing w:before="${level?180:100}" w:after="160"/></w:pPr><w:rPr>${bold?'<w:b/>':''}<w:color w:val="${level||id==='Title'?'102C4B':'26384B'}"/><w:sz w:val="${size}"/></w:rPr></w:style>`).join('')}</w:styles>`;return zip(files)}
